<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>체크수행: 수행평가 알리미</title>
    
    <!-- Gmarket Sans 웹폰트 불러오기 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSans.css">

    <style>
        :root {
            /* 라이트 모드 */
            --bg-body: #f4f6f8;
            --bg-card: #ffffff;
            --bg-card-completed: #f8f9fa;
            --text-main: #2b2f33;
            --text-sub: #6c757d;
            --border-color: #e3e7ed;
            --accent-primary: #4c6ef5;
            --accent-red: #ff6b6b;
            --accent-badge-bg: #edf2ff;
            --chip-bg: #f1f3f5;
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
        }

        body.dark-mode {
            /* 눈이 편안한 소프트 다크 모드 */
            --bg-body: #1e2022;
            --bg-card: #282a2d;
            --bg-card-completed: #212325;
            --text-main: #e1e3e6;
            --text-sub: #9aa0a6;
            --border-color: #3c4043;
            --accent-primary: #8ab4f8;
            --accent-red: #f28b82;
            --accent-badge-bg: #323842;
            --chip-bg: #32363a;
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* Gmarket Sans 폰트 적용 */
            font-family: 'GmarketSans', -apple-system, BlinkMacSystemFont, sans-serif;
            transition: background-color 0.25s, color 0.25s, border-color 0.25s, transform 0.15s;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 28px 16px;
            max-width: 680px;
            margin: 0 auto;
        }

        /* 헤더 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .logo {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.9rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .icon-btn:hover {
            transform: translateY(-1px);
        }

        .btn-add {
            background-color: var(--accent-primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            box-shadow: 0 4px 10px rgba(76, 110, 245, 0.25);
        }

        .btn-add:hover {
            transform: translateY(-1px);
        }

        body.dark-mode .btn-add {
            color: #1e2022;
        }

        /* 탭 버튼 */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 0.95rem;
            font-weight: 500;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 8px;
        }

        .tab-btn.active {
            color: var(--accent-primary);
            background-color: var(--accent-badge-bg);
            font-weight: 700;
        }

        /* Task List */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .task-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px 22px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: relative;
        }

        /* 우선순위 인디케이터 */
        .task-card.priority-1 { border-left: 5px solid var(--accent-red); }
        .task-card.priority-2 { border-left: 5px solid #ff922b; }
        .task-card.priority-3 { border-left: 5px solid var(--accent-primary); }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .period-tag {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            background: var(--accent-badge-bg);
            color: var(--accent-primary);
        }

        .task-title {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.35;
        }

        .task-subject {
            color: var(--accent-primary);
            margin-right: 6px;
        }

        .timer {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent-red);
            font-variant-numeric: tabular-nums;
            text-align: right;
        }

        /* 배지형 상세 내용 */
        .card-details {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.82rem;
            color: var(--text-sub);
            padding-top: 10px;
            border-top: 1px dashed var(--border-color);
        }

        .detail-chip {
            background: var(--chip-bg);
            color: var(--text-main);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 500;
        }

        .card-bottom {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 2px;
        }

        .btn-action {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-action:hover {
            background: var(--chip-bg);
        }

        .btn-complete {
            background: var(--accent-primary);
            color: white;
            border: none;
            font-weight: 700;
        }

        body.dark-mode .btn-complete {
            color: #1e2022;
        }

        /* 완료된 항목 스타일 (투명도 없이 깔끔하게) */
        .task-card.completed {
            background: var(--bg-card-completed);
            border-left: 5px solid var(--text-sub);
        }

        .task-card.completed .task-title {
            text-decoration: line-through;
            color: var(--text-sub);
        }

        .task-card.completed .timer {
            color: var(--text-sub);
        }

        /* 모달 스타일 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
        }

        .modal {
            background: var(--bg-card);
            color: var(--text-main);
            padding: 26px;
            border-radius: 16px;
            width: 90%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-sub);
        }

        .form-group input, .form-group select {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-body);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--accent-primary);
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 8px;
        }

        .empty-msg {
            text-align: center;
            color: var(--text-sub);
            padding: 60px 0;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">📋 체크수행: 수행평가 알리미</div>
        <div class="header-actions">
            <button class="icon-btn" onclick="toggleDarkMode()" id="darkModeBtn">🌙</button>
            <button class="btn-add" onclick="openModal()">+ 추가</button>
        </div>
    </header>

    <!-- 탭 선택 -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('pending')" id="tabPending">진행 중</button>
        <button class="tab-btn" onclick="switchTab('completed')" id="tabCompleted">완료됨</button>
    </div>

    <main class="task-list" id="taskList"></main>

    <!-- 수행평가 추가 모달 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3 style="font-size: 1.15rem; font-weight: 700;">새 수행평가 등록</h3>
            
            <div class="form-group">
                <label>과목 선택</label>
                <select id="subjectCategory">
                    <option value="국어">국어</option>
                    <option value="수학">수학</option>
                    <option value="영어">영어</option>
                    <option value="한국사">한국사</option>
                    <option value="사회/역사">사회/역사</option>
                    <option value="과학">과학</option>
                    <option value="도덕/윤리">도덕/윤리</option>
                    <option value="기술·가정">기술·가정</option>
                    <option value="정보">정보</option>
                    <option value="체육">체육</option>
                    <option value="음악">음악</option>
                    <option value="미술">미술</option>
                    <option value="한문/외국어">한문/외국어</option>
                    <option value="기타">기타</option>
                </select>
            </div>

            <div class="form-group">
                <label>수행평가 내용</label>
                <input type="text" id="taskContent" placeholder="예: 시 창작 발표, 단원 평가">
            </div>

            <div class="form-group">
                <label>수행평가 날짜</label>
                <input type="date" id="date">
            </div>

            <div class="form-group">
                <label>교시</label>
                <select id="period">
                    <option value="1">1교시</option><option value="2">2교시</option>
                    <option value="3">3교시</option><option value="4">4교시</option>
                    <option value="5">5교시</option><option value="6">6교시</option>
                    <option value="7">7교시</option>
                </select>
            </div>

            <div class="form-group">
                <label>준비물</label>
                <input type="text" id="supplies" placeholder="예: 프린트, 필기구">
            </div>

            <div class="form-group">
                <label>자신감 점수 (1 ~ 10)</label>
                <input type="number" id="confidence" min="1" max="10" value="5">
            </div>

            <div class="modal-buttons">
                <button class="icon-btn" onclick="closeModal()">취소</button>
                <button class="btn-add" onclick="addTask()">등록</button>
            </div>
        </div>
    </div>

    <script>
        // 초기 예시 데이터 추가 (첫 로드 시 동작을 쉽게 볼 수 있도록 구성)
        let tasks = JSON.parse(localStorage.getItem('checkSuhaengTasksV7'));
        
        if (!tasks || tasks.length === 0) {
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(today.getDate() + 1);
            const nextWeek = new Date(today);
            nextWeek.setDate(today.getDate() + 5);

            tasks = [
                {
                    id: 1,
                    subjectCategory: "국어",
                    taskContent: "현대시 분석 및 감상문 발표",
                    targetTime: tomorrow.getTime(),
                    dateVal: tomorrow.toISOString().split('T')[0],
                    period: "2",
                    supplies: "작품 유인물, 필기구",
                    confidence: 3,
                    completed: false,
                    notified3Days: true,
                    notified1Day: false
                },
                {
                    id: 2,
                    subjectCategory: "수학",
                    taskContent: "삼각함수 활용 문제풀이 평가",
                    targetTime: nextWeek.getTime(),
                    dateVal: nextWeek.toISOString().split('T')[0],
                    period: "4",
                    supplies: "계산기, 연습장",
                    confidence: 8,
                    completed: false,
                    notified3Days: false,
                    notified1Day: false
                }
            ];
            localStorage.setItem('checkSuhaengTasksV7', JSON.stringify(tasks));
        }

        let currentTab = 'pending';

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('darkModeBtn').innerText = isDark ? '☀️' : '🌙';
            localStorage.setItem('checkSuhaengDark', isDark);
        }

        if (localStorage.getItem('checkSuhaengDark') === 'true') {
            toggleDarkMode();
        }

        function saveTasks() {
            localStorage.setItem('checkSuhaengTasksV7', JSON.stringify(tasks));
        }

        function openModal() { document.getElementById('modalOverlay').style.display = 'flex'; }
        function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tabPending').classList.toggle('active', tab === 'pending');
            document.getElementById('tabCompleted').classList.toggle('active', tab === 'completed');
            renderTasks();
        }

        function addTask() {
            const subjectCategory = document.getElementById('subjectCategory').value;
            const taskContent = document.getElementById('taskContent').value.trim();
            const dateVal = document.getElementById('date').value;
            const period = document.getElementById('period').value;
            const supplies = document.getElementById('supplies').value.trim() || '없음';
            const confidence = parseInt(document.getElementById('confidence').value, 10);

            if (!taskContent || !dateVal) {
                alert('수행평가 내용과 날짜를 입력해주세요!');
                return;
            }

            const targetTime = new Date(`${dateVal}T00:00:00`).getTime();

            tasks.push({
                id: Date.now(),
                subjectCategory,
                taskContent,
                targetTime,
                dateVal,
                period,
                supplies,
                confidence,
                completed: false,
                notified3Days: false,
                notified1Day: false
            });

            saveTasks();
            closeModal();
            renderTasks();

            document.getElementById('taskContent').value = '';
            document.getElementById('date').value = '';
            document.getElementById('supplies').value = '';
            document.getElementById('confidence').value = 5;
        }

        function toggleComplete(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                renderTasks();
            }
        }

        function deleteTask(id) {
            if (confirm('정말 삭제하시겠습니까?')) {
                tasks = tasks.filter(t => t.id !== id);
                saveTasks();
                renderTasks();
            }
        }

        function formatTimer(ms) {
            if (ms <= 0) return "D-Day (오늘)";
            const s = Math.floor((ms / 1000) % 60);
            const m = Math.floor((ms / (1000 * 60)) % 60);
            const h = Math.floor((ms / (1000 * 60 * 60)) % 24);
            const d = Math.floor(ms / (1000 * 60 * 60 * 24));
            return `D-${d} ${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function renderTasks() {
            const listEl = document.getElementById('taskList');
            const now = Date.now();

            let filtered = tasks.filter(t => currentTab === 'pending' ? !t.completed : t.completed);

            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="empty-msg">${currentTab === 'pending' ? '진행 중인 수행평가가 없습니다.' : '완료된 수행평가가 없습니다.'}</div>`;
                return;
            }

            if (currentTab === 'pending') {
                filtered.sort((a, b) => {
                    const scoreA = (1000 - (a.targetTime - now) / (1000 * 60 * 60)) + ((11 - a.confidence) * 15);
                    const scoreB = (1000 - (b.targetTime - now) / (1000 * 60 * 60)) + ((11 - b.confidence) * 15);
                    return scoreB - scoreA;
                });
            }

            listEl.innerHTML = filtered.map((task, index) => {
                const remainingMs = task.targetTime - now;

                let priorityClass = 'priority-3';
                if (index === 0 && currentTab === 'pending') priorityClass = 'priority-1';
                else if (index === 1 && currentTab === 'pending') priorityClass = 'priority-2';

                const dateParts = task.dateVal.split('-');
                const formattedDate = `${parseInt(dateParts[1], 10)}/${parseInt(dateParts[2], 10)}`;

                return `
                    <div class="task-card ${task.completed ? 'completed' : priorityClass}">
                        <div class="card-top">
                            <div>
                                <span class="period-tag">${task.period}교시</span>
                                <div class="task-title">
                                    <span class="task-subject">[${task.subjectCategory}]</span>${task.taskContent}
                                </div>
                            </div>
                            <div class="timer">${task.completed ? '완료' : formatTimer(remainingMs)}</div>
                        </div>
                        <div class="card-details">
                            <span class="detail-chip">일시: ${formattedDate}</span>
                            <span class="detail-chip">준비물: ${task.supplies}</span>
                            <span class="detail-chip">자신감: ${task.confidence}/10</span>
                        </div>
                        <div class="card-bottom">
                            <button class="btn-action" onclick="deleteTask(${task.id})">삭제</button>
                            <button class="btn-action btn-complete" onclick="toggleComplete(${task.id})">
                                ${task.completed ? '복원' : '완료'}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        setInterval(renderTasks, 1000);
        renderTasks();
    </script>
</body>
</html>
